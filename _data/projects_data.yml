      - Equilibration and production runs
    
    results: >-
      Validated GROMACS topology files for OPC, SPC, TIP3P. Used in all 90+ 
      Pd cluster simulations.
    
    tools:
      - GROMACS
      - Python
      - Topology development
    
    skills:
      - Molecular Dynamics
      - Force Field Development
      - Scientific Computing
    
    impact: >-
      Ensures accuracy of solvation environment in all simulations.
    
    links:
      blog: "/posts/2026-07-03-opc-water-gromacs-topology/"

