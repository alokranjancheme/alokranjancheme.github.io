  - id: "cluster-aggregation-analysis"
    order: 1
    theme: "molecular_engineering"
    title: "Cluster-Size Distribution Analysis for Metal Nanoclusters"
    subtitle: "Tracking aggregation dynamics using graph theory and MDAnalysis"
    date: "2026-06-03"
    
    problem: >-
      How do dispersed metal nanoclusters evolve and aggregate over long MD 
      trajectories? Measuring cluster-size distributions requires identifying 
      connected metal atoms and tracking them frame-by-frame.
    
    approach: >-
      Developed a complete Python pipeline using MDAnalysis and scipy.sparse to 
      compute distance matrices, identify connected components, and generate 
      temporal evolution plots of cluster sizes.
    
    methods:
      - Graph connectivity analysis
      - Distance matrix computation
      - Connected components algorithm (scipy.sparse.csgraph)
      - Temporal histogram generation
    
    results: >-
      Successfully analyzed 90 independent 100 ns MD trajectories of Pd₅₅ clusters 
      in five different solvent environments. Generated publication-quality plots 
      showing aggregation pathways and timescales.
    
    tools:
      - Python
      - MDAnalysis
      - SciPy
      - Pandas
      - Matplotlib
    
    skills:
      - Trajectory Analysis
      - Graph Algorithms
      - Data Science
      - Scientific Computing
    
    impact: >-
      Results used for Journal of Chemical Physics manuscript. Provides quantitative 
      metrics for comparing cluster stability across different chemical environments.
    
    links:
      blog: "/posts/2026-07-03-cluster-size-distribution-mdanalysis/"
    
    featured: true

  - id: "palladium-force-field"
    order: 2
    theme: "molecular_engineering"
    title: "Force Field Development for Small Palladium Clusters"
    subtitle: "Parameterization and validation of Pd₃, Pd₄, Pd₅ force fields"
    date: "2023-2024"
    
    problem: >-
      Existing force fields for small metal clusters are limited. Need accurate 
      parameters for palladium clusters in aqueous environments to enable 
      long-timescale simulations.
    
    approach: >-
      Developed custom force field parameters by benchmarking against quantum 
      chemical calculations. Validated against molecular dynamics trajectories 
      and experimental properties.
    
    methods:
      - QM calculations for reference data
      - LAMMPS force field parameterization
      - MD validation simulations
      - Property comparison (binding energies, solvation)
    
    results: >-
      Generated validated force fields for Pd₃, Pd₄, and Pd₅ clusters. FF files 
      available in repository. Good agreement with QM results and literature values.
    
    tools:
      - LAMMPS
      - Quantum Chemistry Software
      - Python
      - GROMACS (for comparison)
    
    skills:
      - Force Field Development
      - Molecular Dynamics
      - Quantum Chemistry
      - Scientific Computing
    
    impact: >-
      These force fields enable study of larger palladium clusters and 
      provide foundation for reactive MD simulations.
    
    featured: true

  - id: "md-solvation-effects"
    order: 3
    theme: "molecular_engineering"
    title: "Solvation Effects on Pd Cluster Stability"
    subtitle: "Water, organic solvents, and mixed aqueous systems"
    date: "2024-2026"
    
    problem: >-
      Why are small Pd clusters stable in water but less stable in organic solvents? 
      Understanding solvation effects is critical for cluster chemistry.
    
    approach: >-
      Ran 90+ MD simulations (100 ns each) of Pd clusters in 5 different solvent 
      environments. Analyzed solvation shell structure, coordination numbers, and 
      aggregation propensity.
    
    methods:
      - MD Simulation (GROMACS, LAMMPS)
      - Radial distribution functions
      - Coordination number analysis
      - Hydrogen bonding analysis
      - Aggregation pathway tracking
    
    results: >-
      Discovered that water's hydrogen bonding network stabilizes metal clusters 
      through shell effects. Organic solvents show different coordination patterns.
    
    tools:
      - GROMACS
      - LAMMPS
      - MDAnalysis
      - Python
    
    skills:
      - Molecular Dynamics
      - Trajectory Analysis
      - Statistical Mechanics
      - Scientific Computing
    
    impact: >-
      Major finding for understanding cluster chemistry. Impacts rational design 
      of solvents for nanomaterial synthesis and catalysis.
    
    featured: true

  - id: "gromacs-setup-pipeline"
    order: 4
    theme: "molecular_engineering"
    title: "GROMACS Equilibration & Production Pipeline"
    subtitle: "Automated workflow for MD simulations from build to production"
    date: "2026-04-2026-06"
    
    problem: >-
      Manual GROMACS setup for multiple systems is error-prone and time-consuming. 
      Need a standardized, reproducible workflow.
    
    approach: >-
      Created bash/Python scripts to automate: system building, energy minimization, 
      NVT equilibration, NPT equilibration, production runs with restart capabilities.
    
    methods:
      - System parameterization (GROMACS)
      - EM algorithm (steepest descent, conjugate gradient)
      - NVT/NPT equilibration (Berendsen, Nosé-Hoover)
      - Production runs with trajectory analysis
    
    results: >-
      Complete pipeline from PDB → production trajectory. Applied to 90+ simulations. 
      Reduces setup time by 70% and ensures reproducibility.
    
    tools:
      - GROMACS
      - Bash
      - Python
      - HPC Job Schedulers (SLURM)
    
    skills:
      - Molecular Dynamics
      - Workflow Automation
      - HPC
      - Scientific Software
    
    impact: >-
      Enables rapid prototyping of new systems. Facilitates teaching and collaboration.
    
    links:
      blog: "/posts/2026-06-17-gromacs-equilibration-production/"

  - id: "water-topology"
    order: 5
